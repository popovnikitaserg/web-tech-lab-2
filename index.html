<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ToDo App</title>
  <style>
    body { font-family: sans-serif; background: #0f1620; color: #e6eef6; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: auto; background: #1e293b; border-radius: 8px; padding: 20px; box-shadow: 0 0 25px rgba(0,0,0,.4); }
    form { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    input, select, button { padding: 8px; border-radius: 6px; border: none; font-size: 14px; }
    button { background: #6EE7B7; color: #0f1620; cursor: pointer; transition: 0.15s; }
    button:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(0,0,0,.3); }

    ul { list-style: none; padding: 0; }
    li { background: #26364a; margin-bottom: 10px; padding: 12px; border-radius: 6px; display: flex; align-items: center; gap: 10px; justify-content: space-between; }

    .task-main { display: flex; flex-direction: column; flex-grow: 1; gap: 4px; }
    .task-meta { font-size: 12px; opacity: 0.7; cursor: pointer; }
    .task-meta:hover { opacity: 1; text-decoration: underline; }

    .edit-date-input { background: #162032; color: #e6eef6; border: 1px solid #6EE7B7; border-radius: 6px; padding: 3px; font-size: 12px; }

    .settings-modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      width: 300px;
      transform: translate(-50%, -50%);
      background: #162032;
      padding: 20px;
      border-radius: 10px;
      z-index: 100;
      box-shadow: 0 0 30px rgba(0,0,0,.5);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .settings-modal label {
      font-size: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .placeholder {
      height: 6px !important;
      background: #6EE7B7 !important;
      border-radius: 3px;
      margin: 6px 0;
    }
    .placeholder.active {
        height: 6px;
        background:#6EE7B7;
        margin: 4px 0;
        border-radius: 3px;
        opacity: 0.8;
    }
    .searchinput {
      margin-left: 8px;
      flex-grow: 1;
      padding: 8px;
    }
  </style>
</head>
<body>
  <script src="app.js" defer></script>
</body>
</html>
